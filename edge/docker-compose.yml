name: edge

# Reverse proxy tunggal untuk SEMUA aplikasi di VPS.
# Aplikasi lain cukup ikut network `edge` dan ditambahkan di Caddyfile.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"      # HTTP/3
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # sertifikat Let's Encrypt (JANGAN dihapus)
      - caddy-config:/config
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
    external: true
